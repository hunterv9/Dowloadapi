[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrabases-downloader"
version = "2.5.0"
description = "Infrabases TikTok & Douyin Downloader — CLI + Web dashboard (FastAPI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ultra Engine Team" }]
keywords = ["tiktok", "douyin", "downloader", "fastapi"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "orjson>=3.10.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Playwright powers the headless-browser profile scraper (recommended)
browser = ["playwright>=1.40.0"]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
]

[project.scripts]
tikdl-cli = "apps.cli:main"
tikdl-web = "apps.web.app:main"

[tool.setuptools.packages.find]
include = ["apps*", "core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
